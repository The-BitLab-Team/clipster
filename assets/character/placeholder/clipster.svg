<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" class="clp" aria-hidden="true" focusable="false">
  <!--
    Clipster (placeholder original): um prendedor de papel com visor no lugar do rosto.
    "Rig" para o formato svg-rig: partes nomeadas que poses.css mostra, esconde e move
    conforme o estado. Não use estilos inline nem elementos de estilo aqui (a CSP bloqueia).
  -->
  <defs>
    <linearGradient id="clp-body-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7480"/>
      <stop offset="1" stop-color="#173c46"/>
    </linearGradient>
    <linearGradient id="clp-visor-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b171d"/>
      <stop offset="1" stop-color="#132830"/>
    </linearGradient>
  </defs>

  <ellipse class="clp-shadow" cx="80" cy="149" rx="44" ry="6" fill="#000000" opacity="0.22" pointer-events="none"/>

  <g class="clp-figure" data-hit="true">
    <g class="clp-pose">
      <g class="clp-handle clp-handle--left">
        <path class="clp-handle-outline" d="M60 74 L47 30 Q45 21 54 20 L61 19.5 Q69 19.5 69 28 L70 74" fill="none" stroke="#3c4f5a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 74 L47 30 Q45 21 54 20 L61 19.5 Q69 19.5 69 28 L70 74" fill="none" stroke="#d3dde4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="clp-handle clp-handle--right">
        <path class="clp-handle-outline" d="M100 74 L113 30 Q115 21 106 20 L99 19.5 Q91 19.5 91 28 L90 74" fill="none" stroke="#3c4f5a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M100 74 L113 30 Q115 21 106 20 L99 19.5 Q91 19.5 91 28 L90 74" fill="none" stroke="#d3dde4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g class="clp-head">
        <path class="clp-body" d="M44 72 H116 Q122 72 123.5 78 L136 131 Q138.5 142 127 142 H33 Q21.5 142 24 131 L36.5 78 Q38 72 44 72 Z" fill="url(#clp-body-fill)"/>
        <path class="clp-shine" d="M45 79 H115" stroke="#86d8dd" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" pointer-events="none"/>
        <rect class="clp-hinge" x="53" y="67" width="24" height="9" rx="4.5" fill="#9fb2bd"/>
        <rect class="clp-hinge" x="83" y="67" width="24" height="9" rx="4.5" fill="#9fb2bd"/>

        <rect class="clp-visor" x="45" y="89" width="70" height="42" rx="11" fill="url(#clp-visor-fill)" stroke="#5fd6cc" stroke-opacity="0.65" stroke-width="1.5"/>

        <g class="clp-face">
          <g class="clp-eyes clp-eyes--open" fill="#7ff2e2">
            <rect class="clp-eye clp-eye--left" x="61" y="100" width="10" height="14" rx="2.5"/>
            <rect class="clp-eye clp-eye--right" x="89" y="100" width="10" height="14" rx="2.5"/>
          </g>
          <g class="clp-eyes clp-eyes--wide" fill="#7ff2e2">
            <rect x="59" y="98" width="14" height="18" rx="4"/>
            <rect x="87" y="98" width="14" height="18" rx="4"/>
            <rect x="66" y="101" width="4" height="4" rx="1" fill="#0b171d"/>
            <rect x="94" y="101" width="4" height="4" rx="1" fill="#0b171d"/>
          </g>
          <g class="clp-eyes clp-eyes--closed" fill="none" stroke="#7ff2e2" stroke-width="2.6" stroke-linecap="round">
            <path d="M60 107 Q66 112 72 107"/>
            <path d="M88 107 Q94 112 100 107"/>
          </g>
          <g class="clp-eyes clp-eyes--happy" fill="none" stroke="#7ff2e2" stroke-width="2.8" stroke-linecap="round">
            <path d="M60 110 Q66 101 72 110"/>
            <path d="M88 110 Q94 101 100 110"/>
          </g>
          <g class="clp-eyes clp-eyes--x" fill="none" stroke="#ff7b72" stroke-width="2.8" stroke-linecap="round">
            <path d="M61 102 L71 112 M71 102 L61 112"/>
            <path d="M89 102 L99 112 M99 102 L89 112"/>
          </g>

          <path class="clp-mouth clp-mouth--smile" d="M72 121.5 Q80 126 88 121.5" fill="none" stroke="#7ff2e2" stroke-width="2.5" stroke-linecap="round"/>
          <path class="clp-mouth clp-mouth--grin" d="M70 120 Q80 130.5 90 120 Z" fill="#7ff2e2" stroke="#7ff2e2" stroke-width="1.5" stroke-linejoin="round"/>
          <path class="clp-mouth clp-mouth--flat" d="M73.5 123 H86.5" fill="none" stroke="#7ff2e2" stroke-width="2.5" stroke-linecap="round"/>
          <path class="clp-mouth clp-mouth--frown" d="M72 126 Q80 119.5 88 126" fill="none" stroke="#ff7b72" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse class="clp-mouth clp-mouth--open" cx="80" cy="123" rx="4.6" ry="3.8" fill="#0b171d" stroke="#7ff2e2" stroke-width="2.2"/>
        </g>

        <circle class="clp-badge" cx="110" cy="94" r="4.5" fill="#f2b84b" stroke="#3b2600" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <!-- Acessórios: não fazem parte da área clicável. Contorno escuro para aparecer em fundos claros. -->
  <g class="clp-props" pointer-events="none">
    <g class="clp-prop clp-prop--dots" fill="#c9f7f0" stroke="#173c46" stroke-width="1.6">
      <circle class="clp-dot clp-dot--1" cx="118" cy="30" r="4"/>
      <circle class="clp-dot clp-dot--2" cx="131" cy="30" r="4"/>
      <circle class="clp-dot clp-dot--3" cx="144" cy="30" r="4"/>
    </g>

    <g class="clp-prop clp-prop--zzz" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g class="clp-z clp-z--big">
        <path d="M122 22 H138 L122 38 H138" stroke="#173c46" stroke-width="6"/>
        <path d="M122 22 H138 L122 38 H138" stroke="#d3dde4" stroke-width="3"/>
      </g>
      <g class="clp-z clp-z--small">
        <path d="M142 6 H151 L142 15 H151" stroke="#173c46" stroke-width="4.4"/>
        <path d="M142 6 H151 L142 15 H151" stroke="#d3dde4" stroke-width="2.2"/>
      </g>
    </g>

    <g class="clp-prop clp-prop--question" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M127 21 Q127 11 135 11 Q143 11 143 19 Q143 25 135 27 L135 32" stroke="#173c46" stroke-width="6.5"/>
      <path d="M127 21 Q127 11 135 11 Q143 11 143 19 Q143 25 135 27 L135 32" stroke="#ffe08a" stroke-width="3.4"/>
      <circle cx="135" cy="39" r="3.2" fill="#ffe08a" stroke="#173c46" stroke-width="1.5"/>
    </g>

    <g class="clp-prop clp-prop--alert">
      <circle class="clp-alert-ring" cx="137" cy="24" r="12" fill="#f2b84b" stroke="#3b2600" stroke-width="1.6"/>
      <path d="M137 16.5 V26" stroke="#3b2600" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="137" cy="31" r="2" fill="#3b2600"/>
    </g>

    <g class="clp-prop clp-prop--sparkles" fill="#ffe08a" stroke="#6b5400" stroke-width="1" stroke-linejoin="round">
      <path class="clp-sparkle clp-sparkle--1" d="M28 30 L30.5 36.5 L37 39 L30.5 41.5 L28 48 L25.5 41.5 L19 39 L25.5 36.5 Z"/>
      <path class="clp-sparkle clp-sparkle--2" d="M140 46 L141.6 50.4 L146 52 L141.6 53.6 L140 58 L138.4 53.6 L134 52 L138.4 50.4 Z"/>
      <path class="clp-sparkle clp-sparkle--3" d="M20 62 L21.2 65.3 L24.5 66.5 L21.2 67.7 L20 71 L18.8 67.7 L15.5 66.5 L18.8 65.3 Z"/>
    </g>
  </g>
</svg>
