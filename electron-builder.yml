# Empacotamento (SPEC §16.1). Nunca publica nada: os scripts usam --publish never.
appId: com.marcosland.clipster
productName: Clipster
copyright: Copyright © 2026 Marcos Land

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'

asarUnpack:
  - resources/**

# Electron Fuses (SPEC §26, item 9).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - nsis
  executableName: Clipster

# Instalação por usuário, sem pedir administrador.
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.productivity
  notarize: false

dmg:
  artifactName: ${name}-${version}.${ext}

# .deb fica para depois: exige "homepage", que depende da decisão D6 (repositório).
linux:
  target:
    - AppImage
  category: Utility
  syncDesktopName: true
  synopsis: Companheiro de desktop animado

appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false
publish: null
